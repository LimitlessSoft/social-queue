title: Rewind to 10:15
publish_at: 2026-10-14T10:00:00Z

sources:
  - en.json DESKTOP_MONITORING_PAGE.SHOWCASE.ITEMS.PLAYBACK.TITLE — "Rewind the workday"
  - en.json DESKTOP_MONITORING_PAGE.SHOWCASE.ITEMS.PLAYBACK.DESCRIPTION — "Something went wrong at 10:15? Pick the day, click the moment on the timeline and see exactly what was on the screen."
  - en.json DESKTOP_MONITORING_PAGE.SHOWCASE.ITEMS.PLAYBACK.POINTS.ITEM_2 — "Play at up to 300× to review a whole day in minutes" (Instagram caption)
  - en.json DESKTOP_MONITORING_PAGE.USE_CASES.ITEMS.ITEM_3.DESCRIPTION — "A deleted file, a wrong payment, a leaked document — replay what happened, when it happened." (only "a deleted file, a wrong payment" used)
  - en.json DESKTOP_MONITORING_PAGE.BENEFITS.ITEMS.ITEM_6.DESCRIPTION — "Record Windows PCs and watch them from a Windows or Linux computer." (backs "PC")
  - en.json DESKTOP_MONITORING_PAGE.FAQ.ITEMS.ITEM_1.ANSWER — "Monitoring should still never be a secret — tell your team that their screens are recorded."
  - en.json DESKTOP_MONITORING_PAGE.INSTALL.CONSENT — "Install the client only on computers you own or manage, and let the people who use them know that their screens are recorded."
  - 'docs/viewer.md (master), Playback bar — "Speed | `1×` (default), `2×`, `5×`, `10×`, `30×`, `60×`, `300×`" (backs 300×)'
  - 'docs/viewer.md (master), Timeline — "Each green column is a time bucket, and its height shows how many frames were recorded in that bucket" (backs the alt text: green marks where screen frames were recorded)'

