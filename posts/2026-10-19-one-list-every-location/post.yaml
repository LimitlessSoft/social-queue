title: One list, every location
publish_at: 2026-10-19T10:00:00Z

sources:
  - en.json DESKTOP_MONITORING_PAGE.SHOWCASE.ITEMS.LIVE.TITLE — "Every computer, one window"
  - 'en.json DESKTOP_MONITORING_PAGE.SHOWCASE.ITEMS.LIVE.DESCRIPTION — "All your computers in one list, with a clear status for each: working, idle or offline. Click one and its screen opens right away."'
  - en.json DESKTOP_MONITORING_PAGE.SHOWCASE.ITEMS.LIVE.POINTS.ITEM_2 — "Name computers after people, teams or rooms"
  - en.json DESKTOP_MONITORING_PAGE.BENEFITS.ITEMS.ITEM_2.DESCRIPTION — "Office, home or another city — computers only need internet, no VPN or network setup."
  - en.json DESKTOP_MONITORING_PAGE.HERO.TITLE — "Every screen in your company. Live and on replay." (the video's end card)
  - en.json DESKTOP_MONITORING_PAGE.FAQ.ITEMS.ITEM_4.ANSWER — "Yes. Computers only need internet access to reach the server — no VPN or changes to your network."
  - en.json DESKTOP_MONITORING_PAGE.USE_CASES.ITEMS.ITEM_1.DESCRIPTION — "Know your office and remote team are on track without standing behind anyone's chair."
  - en.json DESKTOP_MONITORING_PAGE.USE_CASES.ITEMS.ITEM_4.DESCRIPTION — "Reception desks, warehouse terminals, meeting rooms and stores — always know what they are used for."
  - en.json DESKTOP_MONITORING_PAGE.BENEFITS.ITEMS.ITEM_1.DESCRIPTION — "The client runs quietly in the background and sends a new picture only when the screen changes."
  - en.json DESKTOP_MONITORING_PAGE.FAQ.ITEMS.ITEM_1.ANSWER — "The client has no window and runs at low priority, so it does not slow the computer down. Monitoring should still never be a secret — tell your team that their screens are recorded."
  - en.json DESKTOP_MONITORING_PAGE.INSTALL.CONSENT — "Install the client only on computers you own or manage, and let the people who use them know that their screens are recorded."

