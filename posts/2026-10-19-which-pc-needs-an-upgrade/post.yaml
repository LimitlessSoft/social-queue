posts:
  bluesky:
    text: |
      Which PC needs an upgrade? In Desktop Monitoring, open a computer's Resources window and see its processor, memory, graphics, network and disk use, for the last hour or the last month.

      Open a few side by side to compare.
      https://limitlesssoft.com/en/applications/desktop-monitoring
    media: [card-wide.png]
