title: Which PC needs an upgrade?
publish_at: 2026-10-19T10:00:00Z

sources:
  - en.json DESKTOP_MONITORING_PAGE.SHOWCASE.ITEMS.RESOURCES.DESCRIPTION — "Charts of processor, memory, graphics, network and disk use for every PC — for the last hour or the last month."
  - en.json DESKTOP_MONITORING_PAGE.SHOWCASE.ITEMS.RESOURCES.POINTS.ITEM_1 — "Find the machine that needs an upgrade"
  - en.json DESKTOP_MONITORING_PAGE.HERO.TITLE — "Every screen in your company. Live and on replay."
  - en.json DESKTOP_MONITORING_PAGE.BENEFITS.ITEMS.ITEM_6.DESCRIPTION — "Record Windows PCs and watch them from a Windows or Linux computer."
  - 'docs/viewer.md (master), Resources window — "**Resursi** ("Resources") on the agent toolbar opens a window titled `Resursi - <agent name>` ... You can open several, for example to compare agents side by side."'
  - 'docs/viewer.md (master), Range controls — "**1 h** (default on open), **6 h**, **24 h**, **7 d**, **30 d** | Show the last N, ending now"'
  - docs/client.md (master) — "it uploads machine load metrics (CPU, RAM, GPU, network, disk, and the agent's own usage)"

